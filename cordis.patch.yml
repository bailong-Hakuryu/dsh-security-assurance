# Direct-use composition for the repository from which Harness is launched.
# Later profile layers may replace any complete row with deployment policy.
- insert:
    - id: dsh-security-assurance
      name: dsh-security-assurance
      inject:
        - subprocess
    - id: dsh-security-assurance-tools
      name: dsh-security-assurance/tools
    - id: dsh-security-assurance-control-plane-provider
      name: dsh-security-assurance/control-plane-provider
    - id: dsh-security-assurance-host-repository-provider
      name: dsh-security-assurance/host-repository-provider
      config:
        repositories:
          - schemaVersion: 1
            bindingId: current-workspace
            root: !!js process.cwd()
            displayName: Current workspace
            bindings:
              policyId: security/node-package-lifecycle
              assessmentProfileId: security/standard
              evidenceProtectionId: evidence/local-protected
              dataEgressPolicyId: egress/deny-by-default
              platform: !!js process.platform
              deliveryDestinationIds: []
    # The invariant observes the final direct-use composition. Hold it until
    # the Host repository has been durably registered and its supporting
    # runtime services are present; otherwise its fail-closed admission gate
    # can race the bootstrap command that creates current-workspace.
    - id: dsh-security-assurance-invariant
      name: dsh-security-assurance/invariant
      inject:
        - invariants
        - loader
        - securityAssurance
        - securityAssuranceHostRepositories
        - typert
    # Requires a Host-authenticated Workbench authority resolver supplied by
    # the deployment composition; never enable as an anonymous LAN Remote.
    - id: dsh-security-assurance-workbench-remote
      name: dsh-security-assurance/workbench-remote
      disabled: true
