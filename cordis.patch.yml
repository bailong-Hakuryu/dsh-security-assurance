# Security Assurance is installed as a dormant capability. Deployment owners
# enable this row only after providing a qualified configuration.
- insert:
    - id: dsh-security-assurance
      name: dsh-security-assurance
      disabled: true
    - id: dsh-security-assurance-tools
      name: dsh-security-assurance/tools
      disabled: true
    - id: dsh-security-assurance-control-plane-provider
      name: dsh-security-assurance/control-plane-provider
      disabled: true
    - id: dsh-security-assurance-host-repository-provider
      name: dsh-security-assurance/host-repository-provider
      disabled: true
    # Requires a Host-authenticated Workbench authority resolver supplied by
    # the deployment composition; never enable as an anonymous LAN Remote.
    - id: dsh-security-assurance-workbench-remote
      name: dsh-security-assurance/workbench-remote
      disabled: true
